services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: documentops
      POSTGRES_PASSWORD: documentops
      POSTGRES_DB: documentops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documentops -d documentops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://documentops:documentops@postgres:5432/documentops
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POLL_INTERVAL_SECONDS: 10
      PROCESSING_TIMEOUT_SECONDS: 300
      MAX_FILE_SIZE_BYTES: 52428800
      MAX_EXTRACTED_TEXT_LENGTH: 10485760
      MAX_AUTO_RETRIES: 3
      INPUT_DIR: /app/data/input
      RAW_DIR: /app/data/raw
      PROCESSED_DIR: /app/data/processed
      FAILED_DIR: /app/data/failed
      REVIEW_DIR: /app/data/review
      SUPPORTED_EXTENSIONS: .pdf
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://documentops:documentops@postgres:5432/documentops
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: 1
      POLL_INTERVAL_SECONDS: 10
      PROCESSING_TIMEOUT_SECONDS: 300
      MAX_FILE_SIZE_BYTES: 52428800
      MAX_EXTRACTED_TEXT_LENGTH: 10485760
      MAX_AUTO_RETRIES: 3
      INPUT_DIR: /app/data/input
      RAW_DIR: /app/data/raw
      PROCESSED_DIR: /app/data/processed
      FAILED_DIR: /app/data/failed
      REVIEW_DIR: /app/data/review
      SUPPORTED_EXTENSIONS: .pdf
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
